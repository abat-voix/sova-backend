[tool.poetry]
name = "sova-backend"
version = "0.1.0"
description = ""
authors = ["roman"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
django = "5.2.17"
channels = "4.3.2"
channels-redis = "4.3.0"
daphne = "4.2.1"
djangorestframework = "3.18.1"
drf-spectacular = "0.30.0"
dj-database-url = "3.1.2"
gunicorn = "26.2.0"
psycopg = {version = "3.3.5", extras = ["binary"]}
redis = "8.1.0"
mozilla-django-oidc = "5.0.2"
django-filter = "26.1"
openpyxl = "^3.1"
python-dotenv = "1.2.3"
requests = {version = "2.34.2", extras = ["socks"]}
celery = "5.6.3"
xlwt = "1.3.0"
django-storages = {version = "^1.14", extras = ["s3"]}
xlrd = "2.0.2"
docxtpl = "^0.20.2"
cryptography = "50.0.1"

[tool.poetry.group.dev.dependencies]
factory-boy = "3.3.3"
moto = {version = "^5", extras = ["s3"]}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
