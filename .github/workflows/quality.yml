name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: testing
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DATABASE_URL: sqlite:///ci.sqlite3
      EMAIL_HOST: mail.nic.ru
      EMAIL_HOST_USER: noreply@1uup.ru
      EMAIL_HOST_PASSWORD: ci-only-not-a-production-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install Poetry
        run: python -m pip install poetry==1.8.3

      - name: Install dependencies
        run: poetry install --only main --no-root --no-interaction --no-ansi

      - name: Check Django configuration
        run: |
          poetry check --lock
          poetry run python manage.py check

      - name: Check migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: poetry run python manage.py test

      - name: Compile Python sources
        run: poetry run python -m compileall -q .
