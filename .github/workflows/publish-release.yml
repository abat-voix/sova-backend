name: Publish backend release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: testing
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DATABASE_URL: postgresql://sova:sova@localhost:5432/sova
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sova
          POSTGRES_PASSWORD: sova
          POSTGRES_DB: sova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must have the form v1.2.3" >&2
            exit 1
          }

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install and verify backend
        run: |
          python -m pip install poetry==1.8.3
          poetry install --with dev --no-root --no-interaction --no-ansi
          poetry check --lock
          poetry run python manage.py check
          poetry run python manage.py makemigrations --check --dry-run
          poetry run python manage.py test

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/abat-voix/sova-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
